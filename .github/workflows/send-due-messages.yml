name: Send LITe Due Messages (manual)

# MANUAL TESTER ONLY. Production sending happens inside the
# "Refresh LITe REDCap Data" pipeline (fetch → send → commit → deploy),
# gated by the LITE_SEND_LIVE repo variable. Use this dispatch to run a
# one-off send cycle — defaults to dry-run so it's always safe to poke.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = preview only, no actual sends"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

# Same group as the refresh pipeline: a manual send can never race a
# scheduled refresh on the data files / sent-log.
concurrency:
  group: refresh-lite-data
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh due-reminders from REDCap + Google Sheet
        env:
          REDCAP_API_URL: ${{ secrets.REDCAP_API_URL }}
          REDCAP_LITE_TOKEN: ${{ secrets.REDCAP_LITE_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LITE_GOOGLE_SHEET_ID: ${{ secrets.LITE_GOOGLE_SHEET_ID }}
        run: node --max-old-space-size=6144 scripts/fetch-data.mjs

      - name: Fire due messages
        env:
          REDCAP_API_URL: ${{ secrets.REDCAP_API_URL }}
          REDCAP_LITE_TOKEN: ${{ secrets.REDCAP_LITE_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
          QUO_FROM_NUMBER: ${{ secrets.QUO_FROM_NUMBER }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/send-due-messages.mjs

      - name: Commit updated data and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add private/data/ 2>/dev/null || true
          # --autostash: npm install dirties package-lock.json in the
          # workspace; rebase must not refuse over that unstaged noise.
          git diff --staged --quiet || { git commit -m "LITe send-cycle [$(date -u '+%Y-%m-%d %H:%M UTC')]"; git pull --rebase --autostash origin main && git push; }
