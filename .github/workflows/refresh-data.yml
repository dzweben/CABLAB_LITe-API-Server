name: Refresh LITe REDCap Data

on:
  schedule:
    # Every 30 minutes across REDCap's uptime. The cron is only a coarse
    # attempt-limiter — GitHub's scheduler delays runs unpredictably (we've
    # seen a 12:30 AM ET slot fire at 2 AM ET), and UTC cron can't follow
    # DST. The REAL enforcement is the "Gate on REDCap uptime" step below,
    # which checks actual Eastern time at RUN time and skips the whole job
    # during REDCap's nightly downtime (~12:40 AM – 7:00 AM ET).
    - cron: "0,30 11-23 * * *"   # ~7 AM – 7:30 PM ET
    - cron: "0,30 0-5 * * *"     # ~8 PM – 12:30 AM ET (hr 5 covers EST)
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs. The pipeline fetches → commits → `git pull --rebase`
# → vercel build/deploy, all against the same data files. If two runs
# overlap, a deploy can grab a participants.json that another run is
# mid-rebase / mid-write on, shipping a TRUNCATED file the API can't
# parse (dashboard renders empty). cancel-in-progress:false makes each
# run finish fully before the next starts, so a deploy always sees a
# consistent, fully-written file.
concurrency:
  group: refresh-lite-data
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Enforce REDCap's uptime window at RUN time (DST-correct via
      # America/New_York). If GitHub launched this job during REDCap's
      # nightly downtime (~12:40 AM – 7:00 AM ET) — whether by a delayed
      # schedule or otherwise — skip every real step so the run is a clean
      # green no-op instead of a failure + pointless REDCap hit.
      - name: Gate on REDCap uptime (Eastern)
        id: gate
        working-directory: ${{ github.workspace }}
        run: |
          H=$(TZ=America/New_York date +%H)
          M=$(TZ=America/New_York date +%M)
          if { [ "$H" -eq 0 ] && [ "$M" -ge 40 ]; } || { [ "$H" -ge 1 ] && [ "$H" -le 6 ]; }; then
            echo "REDCap downtime (${H}:${M} ET) — skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "REDCap uptime (${H}:${M} ET) — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch data from REDCap + Google Sheet
        if: steps.gate.outputs.skip != 'true'
        env:
          REDCAP_API_URL: ${{ secrets.REDCAP_API_URL }}
          REDCAP_LITE_TOKEN: ${{ secrets.REDCAP_LITE_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LITE_GOOGLE_SHEET_ID: ${{ secrets.LITE_GOOGLE_SHEET_ID }}
        run: node --max-old-space-size=6144 scripts/fetch-data.mjs

      # Send immediately after the fetch, so every send decision runs
      # against completion data that is MINUTES old (the send-time
      # re-check: a reminder only exists in due-reminders.json if its
      # survey is still incomplete as of the fetch above).
      #
      # LIVE/KILL SWITCH: repo variable LITE_SEND_LIVE.
      #   gh variable set LITE_SEND_LIVE --body true    → real sends
      #   gh variable set LITE_SEND_LIVE --body false   → dry-run (default)
      # No commit needed to flip it.
      - name: Install dependencies (sender)
        if: steps.gate.outputs.skip != 'true'
        run: npm install --no-audit --no-fund

      - name: Send due messages
        if: steps.gate.outputs.skip != 'true'
        env:
          REDCAP_API_URL: ${{ secrets.REDCAP_API_URL }}
          REDCAP_LITE_TOKEN: ${{ secrets.REDCAP_LITE_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
          QUO_FROM_NUMBER: ${{ secrets.QUO_FROM_NUMBER }}
          DRY_RUN: ${{ vars.LITE_SEND_LIVE == 'true' && 'false' || 'true' }}
        run: node scripts/send-due-messages.mjs

      # ALWAYS commit (even if the send step failed with partial sends):
      # the sent-log is the idempotency ledger — losing it would re-send
      # every message that DID go out.
      - name: Commit and push updated data
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add private/data/participants.json private/data/due-reminders.json private/data/last-fetch.json 2>/dev/null || true
          git add private/data/sent-log.json private/data/send-state.json 2>/dev/null || true
          git add private/data/send-candidates.json private/data/recovery-sends.json 2>/dev/null || true
          # --quiet on `diff --cached` (staged index) — covers both
          # modified-tracked and brand-new-untracked files.
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-refresh LITe REDCap data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            # Rebase on top of any commit that landed since checkout.
            # -X theirs: if a concurrent run pushed its own data commit,
            # conflicts on these GENERATED files resolve in favor of OUR
            # just-fetched version (during rebase, "theirs" = the commit
            # being replayed, i.e. ours) — freshest fetch always wins.
            # On any residual failure, abort the rebase so no conflicted
            # half-state (markers inside a 9MB JSON) reaches later steps.
            for attempt in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              echo "push retry $attempt failed, sleeping…"
              sleep 5
            done
            # Final integrity check: if the tree is still mid-rebase or
            # conflicted, hard-reset to our own committed state so the
            # validate step sees clean files.
            git rebase --abort 2>/dev/null || true
            git checkout -- private/data/ 2>/dev/null || true
          fi

      - name: Validate data files before deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          # Hard gate: never deploy a file that won't parse. If the fetch
          # or a rebase produced truncated/corrupt JSON, fail here so the
          # last known-good deploy stays live instead of shipping an
          # empty dashboard.
          for f in participants due-reminders last-fetch; do
            node -e "JSON.parse(require('fs').readFileSync('private/data/$f.json','utf8'))" \
              || { echo "::error::private/data/$f.json is not valid JSON — aborting deploy"; exit 1; }
          done
          # Sanity floor: participants.json must hold a non-trivial roster.
          node -e "const d=JSON.parse(require('fs').readFileSync('private/data/participants.json','utf8')); if(!Array.isArray(d.participants)||d.participants.length<100){console.error('::error::participants.json has only',(d.participants||[]).length,'records — aborting deploy');process.exit(1)} console.log('Validated',d.participants.length,'participants')"

      - name: Deploy to Vercel
        if: steps.gate.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "Deployed to: $DEPLOY_URL"
          if [ -n "$DEPLOY_URL" ]; then
            vercel alias set "$DEPLOY_URL" cablab-lite.vercel.app --token=$VERCEL_TOKEN
          fi
